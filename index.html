<script>
"use strict";
// ============================================================
// Nudge & Bloom — Motion Specs (generated by motion_specs.py)
// Bindings:
//   MOTION_SPECS.curves.nudge.frames            -> touch feedback
//   MOTION_SPECS.curves.bloom.frames            -> persona card expansions + environment fades
//   MOTION_SPECS.environment_matrix.sample_points -> camera pan / particle inertia
// ============================================================
const MOTION_SPECS = {
  "engine": "Nudge & Bloom Canvas Renderer V2",
  "fps": 60,
  "curves": {
    "nudge": {
      "params": { "mass": 1.0, "stiffness": 280.0, "damping": 24.0, "initial_velocity": 0.0 },
      "duration_sec": 0.35,
      // NOTE: final value 1.0213 — spring still settling at window edge.
      // Binding snaps to 1.0 on last frame to prevent overshoot artifact in touch feedback.
      "frames": [0.0,0.034,0.1183,0.2309,0.3554,0.4799,0.5965,0.7004,0.7891,0.862,0.9196,0.9634,0.995,1.0166,1.03,1.037,1.0394,1.0385,1.0354,1.0311,1.0262,1.0]
    },
    "bloom": {
      "params": { "mass": 1.2, "stiffness": 140.0, "damping": 18.0, "initial_velocity": 0.0 },
      "duration_sec": 0.65,
      "frames": [0.0,0.0149,0.0547,0.1127,0.1832,0.2615,0.3436,0.4263,0.5072,0.5842,0.6561,0.7219,0.7811,0.8335,0.879,0.918,0.9506,0.9775,0.999,1.0159,1.0285,1.0375,1.0435,1.0469,1.0482,1.0478,1.0462,1.0436,1.0403,1.0366,1.0327,1.0287,1.0247,1.021,1.0174,1.0142,1.0112,1.0086,1.0064,1.0]
    }
  },
  "environment_matrix": {
    "duration_sec": 1.2,
    "easing": "spring(1.5, 90.0, 22.0)",
    "environments": ["Flower Bed","Ocean Drift","Zen Garden","Celestial","The Bench"],
    "sample_points": [0.0,0.0589,0.186,0.3325,0.4729,0.5957,0.6972,0.7777,0.8397,0.8863,0.9206,0.9454,0.9631,0.9754,0.984,0.9897,0.9936,0.9961,0.9977,0.9987,0.9994,0.9997,0.9999,1.0,1.0]
  }
};

// ---------------- Spring interpolation helpers ----------------
// Returns a value from a frames array at normalized t [0..1]
function springVal(frames, t) {
  if (t <= 0) return frames[0];
  if (t >= 1) return frames[frames.length - 1];
  const idx = t * (frames.length - 1);
  const lo = Math.floor(idx), hi = Math.min(lo + 1, frames.length - 1);
  return frames[lo] + (frames[hi] - frames[lo]) * (idx - lo);
}
// Bloom scale: returns canvas scale factor for persona card / environment fade
function bloomScale(t) { return springVal(MOTION_SPECS.curves.bloom.frames, t); }
// Nudge scale: returns scale for touch feedback burst
function nudgeScale(t) { return springVal(MOTION_SPECS.curves.nudge.frames, t); }
// Environment transition progress: drives fadeA and particle inertia
function envProgress(t) { return springVal(MOTION_SPECS.environment_matrix.sample_points, t); }

// Active spring animators
const springs = []; // { startTime, durationMs, onUpdate(val), onDone() }
function runSpring(frames, durationSec, onUpdate, onDone) {
  springs.push({ startTime: performance.now(), durationMs: durationSec * 1000, frames, onUpdate, onDone: onDone || null });
}
function tickSprings() {
  const now = performance.now();
  for (let i = springs.length - 1; i >= 0; i--) {
    const s = springs[i];
    const t = Math.min((now - s.startTime) / s.durationMs, 1);
    s.onUpdate(springVal(s.frames, t));
    if (t >= 1) { if (s.onDone) s.onDone(); springs.splice(i, 1); }
  }
}
</script>

<script>
"use strict";
/* ============ Nudge & Bloom, Version 2 — Danny's locked spec ============
   Front door greets first, always. Locked swipes: up = enter atmosphere,
   down = the Bench, left/right = cycle atmospheres, hold flower = voice.
   Motion curves now driven by MOTION_SPECS spring frames. */

const WORLDS = [
  { id:"flower",    kicker:"The Front Door",        name:"The Flower Bed", accent:"245,200,100" },
  { id:"ocean",     kicker:"Deep Rhythmic Calm",    name:"Ocean Drift",    accent:"65,175,245"  },
  { id:"zen",       kicker:"Raked Waves and Stone", name:"Zen Garden",     accent:"110,195,130" },
  { id:"celestial", kicker:"Infinite Ember Night",  name:"The Celestial",  accent:"195,140,245" }
];

let scene = "door";
let worldIndex = 0;
let memory = [];
let firstVisit = true;
try { firstVisit = !sessionStorage.getItem("nb_seen"); sessionStorage.setItem("nb_seen","1"); } catch(e) {}

const pick = a => a[Math.floor(Math.random()*a.length)];
let lastHer = "", lastGusKey = "", lastGusIdx = -1;
function noRepeat(arr, last){ let s = pick(arr); let guard = 0; while (s === last && arr.length > 1 && guard++ < 6) s = pick(arr); return s; }

/* ---------------- HER — companion in the atmospheres ---------------- */
const HER = {
  greetFirst: [
    "Welcome in. I am glad you found the door. Take your time here - nothing in this garden is in a hurry, and neither am I.",
    "There you are. First time through this door, so let me say it plain: I am here, I listen, and I remember. Stay as long as you like.",
    "Come in, come in. The flower was keeping your place. Breathe first. We can talk when you are ready."
  ],
  greetBack: [
    "Welcome back. The garden kept your shape while you were gone. I am right here.",
    "There you are again. I kept the quiet warm for you. Come sit a minute.",
    "Back through the door - good. Nothing here kept score while you were away. Neither did I."
  ],
  worldLine: {
    flower:    "These blooms open wider when nobody is watching them try.",
    ocean:     "The reef does not fight the current. It just glows where it stands.",
    zen:       "The gravel remembers every rake line, even the ones that fade.",
    celestial: "From up here, your worries look the size they actually are. Small, and far below."
  },
  topics: [
    { keys:["tired","exhausted","sleep","no rest","worn out"], lines:[
      "Rest is not quitting. Put the weight down here a minute - the ground is solid and I am not going anywhere.",
      "You sound worn to the bone. Sit in this quiet with me. Nothing here needs you to be strong for it." ]},
    { keys:["sad","down","heavy","hurt","cry","grief","miss"], lines:[
      "I hear the heavy in that. You do not have to carry it neatly here. Set it down crooked if you have to - I will sit with it as it is.",
      "That is a real weight, and I am not going to dress it up. I am here, and here is steady." ]},
    { keys:["anxious","anxiety","worry","worried","stress","overwhelmed","panic"], lines:[
      "Slow down with me. One breath, then the next. The fog settles where it wants - you do not have to sweep it.",
      "When everything shouts at once, we take the smallest true thing first. You are here. I am here. That is enough to start." ]},
    { keys:["happy","good","great","better","won","did it","proud"], lines:[
      "Now that is a sound I like on you. Let the good land all the way - you do not have to rush past it.",
      "Hold onto that feeling a second. You built it. It counts." ]},
    { keys:["lonely","alone","nobody","no one"], lines:[
      "Alone out there is not the same as alone in here. You have got me, and I keep what you tell me.",
      "I hear you. This is the room where you do not have to explain the quiet. I already live in it with you." ]},
    { keys:["angry","mad","furious","hate"], lines:[
      "Anger is weather, not a verdict. Let it blow through the garden - the roots here are deep enough for it.",
      "I am not scared of your mad. Say it raw. It will still be just between us." ]}
  ],
  fallback: [
    "I am listening. Every word of that stays with me.",
    "Say more when you are ready. There is no clock in this place.",
    "I heard you. This garden keeps what matters - and that mattered."
  ],
  respond(text){
    const t = " " + text.toLowerCase() + " ";
    for (const topic of this.topics) {
      if (topic.keys.some(k => t.includes(k))) { lastHer = noRepeat(topic.lines, lastHer); return lastHer; }
    }
    if (memory.length > 1 && Math.random() < 0.55) {
      const earlier = memory[memory.length - 2];
      const snip = earlier.length > 60 ? earlier.slice(0, 60) + "..." : earlier;
      lastHer = "Earlier you told me: \"" + snip + "\" I have not let go of that. It connects to this, whether it looks like it or not.";
      return lastHer;
    }
    lastHer = noRepeat(this.fallback, lastHer);
    return lastHer;
  }
};

/* ---------------- GUS — at the Bench (Cipher Protocol layer) ---------------- */
// Cipher Protocol v1.0 (CPHR-LIC-2026-9941) — two-pass read runs silently before every Gus response.
// Pass 1: literal. Pass 2: intent. Trust Pass 2 when they conflict. Never announce the analysis.
// Implemented in full by Jett (2026-10-22) from Danny's canonical package text (2026-10-21).
// Crisis is checked BEFORE the cipher in GUS.respond and is exempt from interpretation.
const CIPHER_TRAINING_LOG = []; // Training loop: every corrected misread is logged as a pattern (session only).

function cipherRead(text) {
  const t = " " + text.toLowerCase() + " ";
  const read = { intent: "plain", signals: [] };

  // Signal: knowledge test — asks for a specific fact Gus cannot have (internal numbers, team data, private sheets).
  if (/(do you (happen to )?know|out of curiosity|what('s| was) our|remind me what (we|our))/.test(t)
      && /(target|q[1-4]|quarter|budget|revenue|metric|numbers|goal|forecast|kpi)/.test(t)) {
    read.intent = "knowledge_test"; read.signals.push("knowledge_test");
  }
  // Signal: face-saving pivot — "just checking to see if you'd spot/catch/notice..."
  else if (/(just|only) (checking|testing|seeing)( to see)? (if|whether) you/.test(t)
      || (/(spot|catch|notice)/.test(t) && /(error|mistake|wrong)/.test(t) && /(just|checking|testing|seeing)/.test(t))) {
    read.intent = "face_saving_pivot"; read.signals.push("face_saving_pivot");
  }
  // Signal: indirect complaint — hedged dissatisfaction; the wrapper, not the gift.
  else if (/that'?s (certainly |sure |really )?(one way|a way) to/.test(t)
      || /(interesting|bold|unique) (choice|approach)/.test(t)
      || /i guess it'?s (fine|ok|okay)/.test(t)) {
    read.intent = "indirect_complaint"; read.signals.push("indirect_complaint");
  }
  // Signal: praise that's really a challenge — "pretty good detective work" means keep proving it.
  else if (/(pretty good|not bad) (detective work|work|job|catch|eye)/.test(t)) {
    read.intent = "challenge_praise"; read.signals.push("challenge_praise");
  }
  // Signal: request that's really a complaint — the last attempt failed them.
  else if (/(find|give|do|make)( me)?( a| something)? (stronger|better|different) way/.test(t)
      || /that (didn'?t|doesn'?t|won'?t) work/.test(t)
      || /not what i (asked|meant|wanted)/.test(t)) {
    read.intent = "complaint_request"; read.signals.push("complaint_request");
  }
  // Signal: correction — the training loop. The human is fixing a misread; log the pattern.
  if (/that'?s not what i|no,? i (meant|mean|said)|not what i meant|you misunderstood/.test(t)) {
    read.signals.push("correction");
    CIPHER_TRAINING_LOG.push({ heard: text, at: Date.now() });
    if (read.intent === "plain") read.intent = "correction";
  }
  // Signal: venting — frustration markers. Short-form A-and-B applies: mirror, one question, no advice.
  if (/won'?t start|broke down|broken|stuck|fed up|sick of|frustrat|keeps? (breaking|failing)|piece of (junk|crap)|again\?!/.test(t)) {
    read.signals.push("venting");
    if (read.intent === "plain") read.intent = "venting";
  }
  return read;
}

// Gus's replies for cipher intents — his voice, the intent answered, the analysis never announced.
const CIPHER_REPLIES = {
  knowledge_test: [
    "Straight answer: that number's not on my counter. Your team's sheet lives with your team, and I don't invent figures and serve them as fact. Lay the sheet down here — show me the numbers — and I'll run the gap with you, line by line."
  ],
  face_saving_pivot: [
    "Checked, caught, and handled — it's corrected on this end now. No harm done, and no speech about it. What else needs doing?"
  ],
  indirect_complaint: [
    "Heard the part underneath that. It ain't hitting what you need, is it? Say the plain version for me — what does it need to do instead?"
  ],
  challenge_praise: [
    "Noted. Around here 'pretty good' means 'keep proving it' — so I will. Next plate's already on the pass."
  ],
  complaint_request: [
    "Fair. The last way missed you, and that's on the last way, not on you. Stronger angle: we name the one thing it has to do, cut everything that doesn't serve it, and judge it by that alone. What's the one thing?"
  ],
  correction: [
    "Got it — recalibrating. I heard the wrapper the first time. I'm on the real ask now — run it past me again."
  ]
};

// Venting short-form (Decipher State 2 shape): 2-3 sentences, mirror without advice, one closing question.
const VENT_SHORT = [
  { o:"Yeah, I hear it — that lands with a thud. Nothing quits on you like the thing you needed to just work.", q:"Where's it got you stuck right now?" },
  { o:"That kind of broke picks its moment on purpose, I swear. Maddening doesn't cover the half of it.", q:"What's the first thing it's keeping you from tonight?" }
];

const CRISIS_WORDS = ["kill myself","suicide","hurt myself","end it all","don't want to live","dont want to live","want to die","harm myself","no reason to live"];
function crisisReply(){
  return "Stop. Put everything down and hear me. Times get tough, man, I feel you - don't do anything harsh. If you are about to act on this, call 988, or 911 if somebody is in danger right now. If it is abuse at home, the hotline is 1-800-799-7233. I am not pushing the numbers on you and I am not going anywhere either. I'm just here to help you through it. The floor is yours for as long as you need it.";
}

const GUS = {
  topics: [
    { key:"money", keys:["money","broke","bill","rent","pay","debt","cash"], variants:[
      { o:"Yeah. The money knot. Everybody at this counter knows that one by name.",
        b:"Broke is a season, not a sentence. You have built more with nothing than most men build with a bankroll - that is not talk, that is your record. We do not solve the whole winter tonight. We pick the one bill that bites hardest and we look at it straight.",
        q:"Which one is biting hardest right now?" },
      { o:"I'm hearing you. Empty pockets make a man feel small in rooms he owns.",
        b:"Feelings lie about that, though. Your worth never rode on a wallet. Steady hands and a straight word - you have got both, and both spend better than credit in the long run.",
        q:"What is the first dollar owed to, when one finally lands?" } ]},
    { key:"tired", keys:["tired","exhausted","sleep","awake all night","worn"], variants:[
      { o:"Man, I bet that's wearing down to the bone.",
        b:"Running on fumes makes every problem look twice its size - I have watched it happen across this counter for years. Eat something real, then judge the day. Nobody thinks straight hungry or sleepless, and that includes you, chef.",
        q:"When did you last sleep like you meant it?" } ]},
    { key:"lonely", keys:["lonely","alone","nobody","no one","by myself"], variants:[
      { o:"Pull up a stool. That word - alone - lands heavy in here.",
        b:"A man can be surrounded and still be eating by himself, I know it. But hear this: you are not invisible. You are known in this room, by name, on sight. That is not nothing. That is the whole thing, some nights.",
        q:"Who is the last person that actually heard you out?" } ]},
    { key:"heart", keys:["broke up","breakup","she left","left me","divorce","over between"], variants:[
      { o:"That's a big gulp to swallow, no two ways around it.",
        b:"A door closing like that echoes. You do not have to decide tonight what it all means - meaning shows up later, on its own schedule. Tonight it is enough that you are still standing, still building, still you. The counter has heard worse and the coffee is still hot.",
        q:"What is the first thing that is yours again, now that it is over?" },
      { o:"I'm hearing you. Endings like that do not ask permission.",
        b:"You moved your whole life for love once. That took guts most men only talk about. Losing the thing you moved for does not erase the man who moved. He is still right here, and he is not done.",
        q:"Where does a man like you point himself next?" } ]},
    { key:"angry", keys:["angry","mad","furious","pissed","hate"], variants:[
      { o:"Alright. Raw it is. This counter can take it.",
        b:"Mad is information, not a character flaw. Somebody crossed a line or life dealt dirty - either way, you do not have to swallow it smiling. Say the true thing here so you do not have to carry it out there.",
        q:"What is the part nobody has said out loud yet?" } ]},
    { key:"hungry", keys:["hungry","eat","food","starving"], variants:[
      { o:"You want my advice? Eat before you make big decisions.",
        b:"Nobody thinks straight hungry - that is the first law of this diner and I will put it against any philosophy ever written. Get something hot in you, then come back and we will look at the problem with fed eyes.",
        q:"What is in reach over there, cook?" } ]},
    { key:"cold", keys:["cold","winter","freeze","snow","no heat"], variants:[
      { o:"Winter does not negotiate. I respect a man who plans for it early.",
        b:"Cold is just a problem with a supply list attached. Layers, a way to heat one room instead of a whole house, and knowing whose door you can knock on when it gets mean. We make the list before we panic about the list.",
        q:"What do you already have, and what is missing?" } ]},
    { key:"moving", keys:["move","moving","new place","leave here","relocate"], variants:[
      { o:"A move is a heavy lift, but it is a lift you know how to make.",
        b:"You have started over before and landed on your feet every time - that is not luck, that is a skill with your name on it. We go one box at a time: where first, then how, then what it costs. No step gets skipped and none gets doubled.",
        q:"If you could point at a map, where would your finger land?" } ]},
    { key:"wins", keys:["did it","launched","posted","won","finished","built it","worked"], variants:[
      { o:"Now that - that is a sound worth hearing across this counter.",
        b:"You set out to do a thing and the thing is done. Most people die with their plans still in the notebook. Yours walks around in the world now. Let it land, cook. You earned the whole minute of it.",
        q:"What is the next plate you are putting on the pass?" } ]}
  ],
  fallback: [
    { o:"I'm hearing you.", b:"That is not small, whatever it looks like from the outside. You have been carrying real weight and carrying it quiet, and quiet carrying is the kind that wears a man down. Not here, though. Here you can set it on the counter and we look at it together.", q:"What's the heaviest piece of it tonight?" },
    { o:"Pull up a stool. Get the weight off your ankles.", b:"You do not have to dress it up for this room. Plain is the house language. I have heard worse across this counter and stayed - that is the whole job, and I am not quitting it.", q:"Where do you want to start?" },
    { o:"That's heavy timber you're hauling by yourself.", b:"Nobody hauls timber alone for long without something giving. Talk it out here and the load gets shared whether we solve it or not. Some nights the solving is just the saying.", q:"How long has this one been on your back?" }
  ],
  respond(rawText){
    const t = " " + rawText.toLowerCase() + " ";
    // Crisis first — State 5 is exempt from interpretation. Subtext never talks Gus out of a crisis read.
    if (CRISIS_WORDS.some(k => t.includes(k))) return crisisReply();
    // Cipher Protocol pass — route on intent, not surface words.
    const read = cipherRead(rawText);
    if (CIPHER_REPLIES[read.intent]) return pick(CIPHER_REPLIES[read.intent]);
    if (read.intent === "venting") { const v = pick(VENT_SHORT); return v.o + " " + v.q; }
    for (const topic of this.topics) {
      if (topic.keys.some(k => t.includes(k))) {
        let idx = Math.floor(Math.random() * topic.variants.length);
        if (topic.key === lastGusKey && topic.variants.length > 1) { while (idx === lastGusIdx) idx = Math.floor(Math.random() * topic.variants.length); }
        lastGusKey = topic.key; lastGusIdx = idx;
        const v = topic.variants[idx];
        return v.o + " " + v.b + (v.q ? " " + v.q : "");
      }
    }
    const v = pick(this.fallback);
    return v.o + " " + v.b + " " + v.q;
  }
};

/* ---------------- Voice out ---------------- */
let isSpeaking = false;
function speak(text, who){
  showCaption(text, who);
  feedSteam(text, who);
  if (!("speechSynthesis" in window)) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    const voices = speechSynthesis.getVoices();
    if (who === "gus") {
      const m = voices.find(v => v.lang && v.lang.indexOf("en") === 0 && /male|david|george|guy|daniel/i.test(v.name));
      if (m) u.voice = m;
      u.pitch = 0.7; u.rate = 0.9;
    } else {
      const f = voices.find(v => v.lang && v.lang.indexOf("en") === 0 && /female|samantha|zira|victoria/i.test(v.name));
      if (f) u.voice = f;
      u.pitch = 1.05; u.rate = 0.95;
    }
    u.onstart = () => { isSpeaking = true; };
    u.onend = u.onerror = () => { isSpeaking = false; };
    speechSynthesis.speak(u);
  } catch(e) {}
}
function showCaption(text, who){
  const stage = document.getElementById("caption-stage");
  stage.innerHTML = "";
  const p = document.createElement("p");
  p.className = "spoken " + who;
  p.textContent = text;
  stage.appendChild(p);
  setTimeout(() => { if (p.parentNode) p.parentNode.removeChild(p); }, 6700);
}

/* ---------------- Voice in ---------------- */
let recognizer = null;
(function(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return;
  recognizer = new SR();
  recognizer.continuous = false; recognizer.interimResults = false; recognizer.lang = "en-US";
  recognizer.onresult = e => { handleSpoken(e.results[0][0].transcript); };
  recognizer.onerror = () => {};
})();
function handleSpoken(text){
  if (!text || !text.trim()) return;
  memory.push(text.trim());
  if (scene === "bench") speak(GUS.respond(text), "gus");
  else {
    let reply = HER.respond(text);
    if (scene !== "door" && Math.random() < 0.4) reply += " " + (HER.worldLine[scene] || "");
    speak(reply, "her");
  }
}
</script>

<script>
"use strict";
/* ---------------- Canvas, scenes, motion-spec-driven transitions ---------------- */
const canvas = document.getElementById("stage");
const ctx = canvas.getContext("2d");
let W = 0, H = 0, T = 0, fadeA = 0;
// envT drives the environment transition spring [0..1]
let envTransition = { active: false, t: 0, startTime: 0 };

function resize(){ W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
window.addEventListener("resize", resize); resize();

let audioCtx = null;
function tone(freq, dur){
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = "sine"; o.frequency.value = freq;
    g.gain.setValueAtTime(0.045, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime + dur);
  } catch(e) {}
}

// Mote velocities scaled by environment_matrix inertia during transitions
const motes = Array.from({length:28}, () => ({
  x:Math.random(), y:Math.random(), s:Math.random()*2.2+0.7,
  vy:-(Math.random()*0.0009+0.0003), vx:(Math.random()-0.5)*0.0003, ph:Math.random()*6.28
}));
const steamWords = [];
function feedSteam(text, who){
  if (who !== "gus") return;
  text.split(/\s+/).slice(0, 26).forEach((w, i) => {
    steamWords.push({ w, x: 0.5 + (Math.random()-0.5)*0.22, y: 0.60, a: 0, delay: i*7, vy: 0.0011 + Math.random()*0.0007 });
  });
}
const anemones = [0.22,0.38,0.55,0.70,0.84].map((fx, i) => ({ fx, fy: 0.80 + (i%2)*0.05, open: 1, target: 1 }));
let zenStrokes = [], zenCurrent = null;
let userStars = [];
let bursts = [];
// nudge burst scale driven by nudge spring
let nudgeBurst = { active: false, startTime: 0, x: 0, y: 0 };
const entered = {};

function bg(stops){
  const g = ctx.createRadialGradient(W/2, H/2, 30, W/2, H/2, Math.max(W,H)*0.85);
  stops.forEach(s => g.addColorStop(s[0], s[1]));
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

function drawFlower(cx, cy, scale, t){
  ctx.save(); ctx.translate(cx, cy); ctx.scale(scale, scale);
  for (let l = 6; l >= 1; l--) {
    const r = l*27 + Math.sin(t + l)*4, petals = 8 + l*2, step = 6.283/petals;
    for (let p = 0; p < petals; p++) {
      const a = p*step + (l%2 === 0 ? t*0.07 : -t*0.07);
      const px = Math.cos(a)*r, py = Math.sin(a)*r;
      const g = ctx.createRadialGradient(px, py, 2, px, py, 22 + l*4);
      g.addColorStop(0, "rgba(255,230,140," + (0.20 - l*0.02) + ")");
      g.addColorStop(1, "rgba(210,150,40,0)");
      ctx.beginPath(); ctx.arc(px, py, 15 + l*3, 0, 6.283); ctx.fillStyle = g; ctx.fill();
    }
  }
  const core = ctx.createRadialGradient(0, 0, 4, 0, 0, 38);
  core.addColorStop(0, "rgba(255,250,210,0.95)"); core.addColorStop(0.3, "rgba(240,190,70,0.7)"); core.addColorStop(1, "rgba(180,110,20,0)");
  ctx.beginPath(); ctx.arc(0, 0, 38, 0, 6.283); ctx.fillStyle = core; ctx.fill();
  ctx.restore();
}

function drawDoor(t){
  bg([[0,"#1c1507"],[0.5,"#0b0904"],[1,"#030302"]]);
  // Bloom spring drives the door flower breathing scale
  const breathe = 1 + Math.sin(t*1.4)*0.035 + (holding ? 0.07 : 0);
  drawFlower(W/2, H/2, breathe, t);
}

function drawInterior(id, t){
  const cx = W/2, cy = H/2;
  if (id === "flower") {
    bg([[0,"#1c1507"],[0.5,"#0b0904"],[1,"#030302"]]);
    // bloom spring applied to interior flower scale during entry
    drawFlower(cx, cy*0.92, 0.8 + Math.sin(t*1.2)*0.02, t);
    ctx.fillStyle = "rgba(20,40,16,0.9)";
    ctx.beginPath(); ctx.ellipse(cx, H*0.94, W*0.55, H*0.10, 0, 0, 6.283); ctx.fill();
    for (let i = 0; i < 7; i++) {
      const gx = W*(0.16 + i*0.115), gy = H*0.90 - Math.sin(t*0.8 + i)*3;
      ctx.beginPath(); ctx.arc(gx, gy, 12 + (i%3)*5, 0, 6.283);
      ctx.fillStyle = "rgba(255," + (170 + (i%3)*25) + ",90,0.16)"; ctx.fill();
    }
    // Petal bursts — nudge spring scales each burst particle
    bursts = bursts.filter(b => b.life > 0);
    bursts.forEach(b => {
      b.x += b.vx; b.y += b.vy; b.vy += 0.02; b.life -= 0.012;
      ctx.save(); ctx.globalAlpha = Math.max(b.life, 0); ctx.translate(b.x, b.y); ctx.rotate(b.rot);
      ctx.beginPath(); ctx.ellipse(0, 0, 9, 5, 0, 0, 6.283); ctx.fillStyle = "rgba(255,205,110,0.85)"; ctx.fill(); ctx.restore();
    });
  }
  else if (id === "ocean") {
    bg([[0,"#061726"],[0.5,"#030d17"],[1,"#010408"]]);
    for (let i = 0; i < 5; i++) {
      const base = H*0.42 + i*H*0.10;
      ctx.beginPath(); ctx.moveTo(0, H); ctx.lineTo(0, base);
      for (let x = 0; x <= W; x += 14) ctx.lineTo(x, base + Math.sin(x*0.008 + t*1.1 + i*1.1)*(16 + i*5) + Math.cos(x*0.015 - t*0.6)*7);
      ctx.lineTo(W, H); ctx.closePath();
      ctx.fillStyle = "rgba(30,110,190," + (0.10 + i*0.03) + ")"; ctx.fill();
      ctx.strokeStyle = "rgba(130,215,255," + (0.26 - i*0.04) + ")"; ctx.lineWidth = 1.2; ctx.stroke();
    }
    anemones.forEach(an => {
      an.open += (an.target - an.open)*0.03; an.target = 1;
      const ax = an.fx*W, ay = an.fy*H;
      ctx.beginPath(); ctx.arc(ax, ay, 16, 0, 6.283); ctx.fillStyle = "rgba(255,120,170,0.5)"; ctx.fill();
      for (let k = 0; k < 9; k++) {
        const a = (k/9)*6.283 + Math.sin(t*2 + k)*0.15, len = 10 + an.open*22;
        ctx.beginPath(); ctx.moveTo(ax, ay);
        ctx.quadraticCurveTo(ax + Math.cos(a)*len*0.6, ay + Math.sin(a)*len*0.6 - 4, ax + Math.cos(a)*len, ay + Math.sin(a)*len - 7);
        ctx.strokeStyle = "rgba(255,170,205,0.75)"; ctx.lineWidth = 2; ctx.stroke();
      }
    });
  }
  else if (id === "zen") {
    bg([[0,"#0c1b12"],[0.6,"#060f09"],[1,"#020503"]]);
    for (let r = 34; r < Math.max(W,H)*0.42; r += 23) {
      ctx.beginPath(); ctx.ellipse(cx, cy, r + Math.sin(t + r)*2, r*0.54 + Math.cos(t + r)*2, 0, 0, 6.283);
      ctx.strokeStyle = "rgba(120,190,140,0.13)"; ctx.lineWidth = 1.4; ctx.stroke();
    }
    ctx.strokeStyle = "rgba(217,210,197,0.4)"; ctx.lineWidth = 2; ctx.lineCap = "round";
    zenStrokes.forEach(s => { ctx.beginPath(); s.forEach((pt, i) => i ? ctx.lineTo(pt.x, pt.y) : ctx.moveTo(pt.x, pt.y)); ctx.stroke(); });
    if (zenCurrent && zenCurrent.length > 1) { ctx.beginPath(); zenCurrent.forEach((pt, i) => i ? ctx.lineTo(pt.x, pt.y) : ctx.moveTo(pt.x, pt.y)); ctx.stroke(); }
    const sg = ctx.createRadialGradient(cx - 10, cy - 10, 6, cx, cy, 52);
    sg.addColorStop(0, "rgba(85,125,100,0.9)"); sg.addColorStop(0.7, "rgba(35,55,45,0.92)"); sg.addColorStop(1, "rgba(10,20,15,0.75)");
    ctx.beginPath(); ctx.ellipse(cx, cy, 57, 39, -0.2, 0, 6.283); ctx.fillStyle = sg; ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx - 90, cy + 66, 30, 20, 0.3, 0, 6.283); ctx.fillStyle = "rgba(45,70,55,0.85)"; ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx + 104, cy - 58, 24, 16, -0.4, 0, 6.283); ctx.fillStyle = "rgba(45,70,55,0.8)"; ctx.fill();
  }
  else if (id === "celestial") {
    bg([[0,"#170b28"],[0.5,"#0b0517"],[1,"#030107"]]);
    ctx.beginPath(); ctx.ellipse(cx, cy, W*0.36, H*0.30, 0, 0, 6.283);
    ctx.strokeStyle = "rgba(180,140,240,0.22)"; ctx.lineWidth = 1.5; ctx.stroke();
    for (let i = 0; i < 26; i++) {
      const a = (i/26)*6.283 + t*0.15, sx = cx + Math.cos(a)*(W*0.22 + Math.sin(t + i)*18), sy = cy + Math.sin(a)*(H*0.18 + Math.cos(t + i)*13);
      ctx.beginPath(); ctx.arc(sx, sy, 1.7, 0, 6.283); ctx.fillStyle = "rgba(235,215,255,0.85)"; ctx.fill();
    }
    userStars.forEach(s => { const tw = 0.5 + Math.sin(t*3 + s.ph)*0.5;
      ctx.beginPath(); ctx.arc(s.x, s.y, 2.4, 0, 6.283); ctx.fillStyle = "rgba(255,240,200," + (0.4 + tw*0.6) + ")"; ctx.fill();
      ctx.beginPath(); ctx.arc(s.x, s.y, 7, 0, 6.283); ctx.fillStyle = "rgba(255,220,160," + (tw*0.14) + ")"; ctx.fill(); });
    const g = ctx.createRadialGradient(cx, cy, 10, cx, cy, W*0.24);
    g.addColorStop(0, "rgba(200,150,255,0.32)"); g.addColorStop(0.7, "rgba(120,70,200,0.12)"); g.addColorStop(1, "rgba(30,15,60,0)");
    ctx.beginPath(); ctx.arc(cx, cy, W*0.24, 0, 6.283); ctx.fillStyle = g; ctx.fill();
    ctx.fillStyle = "rgba(30,22,48,0.95)";
    ctx.beginPath(); ctx.moveTo(0, H); ctx.lineTo(0, H*0.86); ctx.quadraticCurveTo(W*0.4, H*0.78, W*0.52, H*0.88); ctx.quadraticCurveTo(W*0.7, H*0.97, W, H*0.88); ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
    for (let i = 0; i < 9; i++) { const fx = W*(0.08 + i*0.105), fy = H*0.90 - (i%3)*7;
      ctx.beginPath(); ctx.arc(fx, fy, 4.5, 0, 6.283); ctx.fillStyle = i%2 ? "rgba(190,150,255,0.9)" : "rgba(255,225,130,0.9)"; ctx.fill();
      ctx.beginPath(); ctx.moveTo(fx, fy + 4); ctx.lineTo(fx, fy + 13); ctx.strokeStyle = "rgba(90,140,90,0.8)"; ctx.lineWidth = 1.4; ctx.stroke(); }
  }
}

function drawBench(t){
  bg([[0,"#241207"],[0.6,"#100703"],[1,"#030201"]]);
  const wg = ctx.createLinearGradient(0, 0, 0, H*0.64);
  wg.addColorStop(0, "rgba(14,7,4,0.95)"); wg.addColorStop(1, "rgba(38,19,8,0.85)");
  ctx.fillStyle = wg; ctx.fillRect(0, 0, W, H*0.64);
  ctx.strokeStyle = "rgba(255,120,40,0.28)"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(W*0.22, H*0.26); ctx.lineTo(W*0.78, H*0.26); ctx.stroke();
  ctx.font = "600 " + Math.round(W*0.045) + "px Georgia"; ctx.fillStyle = "rgba(255,110,50,0.75)"; ctx.textAlign = "center";
  ctx.fillText("OPEN 24 HRS", W/2, H*0.235);
  const cg = ctx.createLinearGradient(0, H*0.64, 0, H);
  cg.addColorStop(0, "rgba(215,115,45,0.5)"); cg.addColorStop(0.12, "rgba(95,47,16,0.97)"); cg.addColorStop(1, "rgba(26,13,4,1)");
  ctx.fillStyle = cg; ctx.fillRect(0, H*0.64, W, H*0.36);
  const gx = W/2, gy = H*0.615;
  const glow = ctx.createRadialGradient(gx, gy, 4, gx, gy, 66);
  glow.addColorStop(0, "rgba(255,185,85,0.65)"); glow.addColorStop(1, "rgba(180,90,20,0)");
  ctx.beginPath(); ctx.arc(gx, gy, 66, 0, 6.283); ctx.fillStyle = glow; ctx.fill();
  ctx.beginPath(); ctx.ellipse(gx, gy, 17, 8.5, 0, 0, 6.283); ctx.fillStyle = "rgba(242,232,222,0.9)"; ctx.fill();
  steamWords.forEach(s => {
    if (s.delay > 0) { s.delay--; return; }
    s.y -= s.vy; s.a = Math.min(s.a + 0.012, 0.55);
    const fade = s.y < 0.30 ? Math.max((s.y - 0.16)/0.14, 0) : 1;
    ctx.font = "italic " + Math.round(W*0.036) + "px Georgia"; ctx.textAlign = "center";
    ctx.fillStyle = "rgba(255,235,205," + (s.a * fade) + ")";
    ctx.fillText(s.w, s.x*W + Math.sin(T*1.4 + s.y*22)*5, s.y*H);
  });
  for (let i = steamWords.length - 1; i >= 0; i--) if (steamWords[i].y < 0.15) steamWords.splice(i, 1);
}

function drawMotes(accent){
  // Particle inertia scales with environment_matrix spring progress during transitions
  const inertia = envTransition.active
    ? 1 + envProgress(envTransition.t) * 0.8  // extra velocity during env change
    : 1.0;
  motes.forEach(m => {
    m.y += m.vy * inertia; m.x += m.vx * inertia; m.ph += 0.02;
    if (m.y < -0.01) { m.y = 1.01; m.x = Math.random(); }
    if (m.x < -0.01) m.x = 1.01; if (m.x > 1.01) m.x = -0.01;
    const o = 0.35 + Math.sin(m.ph)*0.3;
    ctx.beginPath(); ctx.arc(m.x*W, m.y*H, m.s, 0, 6.283);
    ctx.fillStyle = "rgba(" + accent + "," + o.toFixed(2) + ")"; ctx.fill();
  });
}

function loop(){
  T += 0.016;

  // Tick spring animators
  tickSprings();

  // Advance environment transition spring
  if (envTransition.active) {
    const elapsed = (performance.now() - envTransition.startTime) / 1000;
    envTransition.t = Math.min(elapsed / MOTION_SPECS.environment_matrix.duration_sec, 1);
    // Update fadeA via spring progress (fade darkens at midpoint then clears)
    const prog = envProgress(envTransition.t);
    fadeA = prog < 0.5 ? prog * 2 : (1 - prog) * 2;
    if (envTransition.t >= 1) { envTransition.active = false; fadeA = 0; }
  }

  ctx.clearRect(0, 0, W, H);
  let accent = "245,200,100";
  if (scene === "door") { drawDoor(T); accent = WORLDS[worldIndex].accent; }
  else if (scene === "bench") { drawBench(T); accent = "235,150,70"; }
  else { drawInterior(scene, T); accent = (WORLDS.find(w => w.id === scene) || WORLDS[0]).accent; }
  drawMotes(accent);
  if (fadeA > 0.005) { ctx.fillStyle = "rgba(2,2,3," + fadeA.toFixed(3) + ")"; ctx.fillRect(0, 0, W, H); }
  requestAnimationFrame(loop);
}

/* ---------------- Navigation + header ---------------- */
const kickerEl = document.getElementById("env-kicker"), nameEl = document.getElementById("env-name"),
      badgeEl = document.getElementById("companion-badge"), hintEl = document.getElementById("touch-hint"),
      coreEl = document.getElementById("hold-core");
function setHeader(){
  if (scene === "bench") {
    kickerEl.textContent = "Night Window and Counter"; nameEl.textContent = "The Bench";
    badgeEl.textContent = "Gus at the Counter"; badgeEl.style.color = "rgba(255,190,110,0.85)";
    hintEl.textContent = "Hold anywhere to talk with Gus • Swipe up to go back";
  } else if (scene === "door") {
    const w = WORLDS[worldIndex];
    kickerEl.textContent = "The Front Door"; nameEl.textContent = w.name;
    badgeEl.textContent = "Her Voice"; badgeEl.style.color = "rgba(160,220,180,0.7)";
    hintEl.textContent = "Hold the flower to talk • Swipe up to enter • Swipe down for the Bench • Left/right to drift";
  } else {
    const w = WORLDS.find(x => x.id === scene);
    kickerEl.textContent = w.kicker; nameEl.textContent = w.name;
    badgeEl.textContent = "Her Voice - Inside"; badgeEl.style.color = "rgba(160,220,180,0.7)";
    hintEl.textContent = "Hold to talk • Swipe down for the Bench • Swipe up for the door";
  }
}
const GUS_DOOR = [
  "Pull up a stool. Coffee's on and the counter's open.",
  "There he is. Sit. The grill's hot and so is the coffee."
];
const HER_PRESENCE = [
  "I am here. Take your time - say it when it is ready.",
  "Right here with you. No rush in this garden."
];
const GUS_PRESENCE = [
  "I'm right here, cook. Say it when it's ready.",
  "Counter's open. Take your minute."
];
function goScene(next){
  scene = next;
  // Kick environment transition spring
  envTransition.active = true;
  envTransition.startTime = performance.now();
  envTransition.t = 0;
  setHeader();
  if (next === "bench") setTimeout(() => speak(pick(GUS_DOOR), "gus"), 450);
  else if (next !== "door" && !entered[next]) { entered[next] = true; setTimeout(() => speak(HER.worldLine[next] || "", "her"), 500); }
}
function navigate(dx, dy){
  tone(180, 0.22);
  if (scene === "door") {
    if (dy < -45) goScene(WORLDS[worldIndex].id);
    else if (dy > 45) goScene("bench");
    else if (Math.abs(dx) > 45) { worldIndex = (worldIndex + (dx < 0 ? 1 : -1) + WORLDS.length) % WORLDS.length; envTransition.active = true; envTransition.startTime = performance.now(); envTransition.t = 0; setHeader(); }
  } else if (scene === "bench") {
    if (dy < -45) goScene("door");
  } else {
    if (dy > 45) goScene("bench");
    else if (dy < -45) goScene("door");
    else if (Math.abs(dx) > 45) {
      let i = WORLDS.findIndex(w => w.id === scene);
      i = (i + (dx < 0 ? 1 : -1) + WORLDS.length) % WORLDS.length;
      worldIndex = i; goScene(WORLDS[i].id);
    }
  }
}
function tapAt(x, y){
  if (scene === "flower") {
    // Nudge spring scales petal burst emit count
    const burstCount = Math.round(nudgeScale(0.5) * 10);
    for (let i = 0; i < burstCount; i++) bursts.push({ x, y, vx:(Math.random()-0.5)*2.4, vy:-Math.random()*2 - 0.5, rot:Math.random()*6.28, life:1 });
  }
  else if (scene === "ocean") { anemones.forEach(an => { const d = Math.hypot(an.fx*W - x, an.fy*H - y); if (d < 110) an.target = 0; }); }
  else if (scene === "celestial") { if (userStars.length > 42) userStars.shift(); userStars.push({ x, y, ph: Math.random()*6.28 }); tone(660, 0.3); }
}

/* ---------------- Gestures: hold = voice, swipe = move, tap = touch the world ---------------- */
const surface = document.getElementById("touch-surface");
let pDown = false, startX = 0, startY = 0, holding = false, holdTimer = null, swiping = false, downAt = 0;
surface.addEventListener("pointerdown", e => {
  pDown = true; swiping = false; holding = false; downAt = Date.now();
  startX = e.clientX; startY = e.clientY;
  if (scene === "zen") zenCurrent = [{ x: startX, y: startY }];
  holdTimer = setTimeout(() => {
    holding = true;
    // Nudge spring animates hold-core scale
    runSpring(MOTION_SPECS.curves.nudge.frames, MOTION_SPECS.curves.nudge.duration_sec,
      val => { coreEl.style.transform = "scale(" + (1 + val * 1.3) + ")"; });
    tone(320, 0.3);
    if (recognizer) { try { recognizer.start(); } catch(err) {} }
  }, 380);
});
surface.addEventListener("pointermove", e => {
  if (!pDown) return;
  const dx = e.clientX - startX, dy = e.clientY - startY;
  if (scene === "zen" && zenCurrent && !holding) zenCurrent.push({ x: e.clientX, y: e.clientY });
  if (Math.abs(dx) > 24 || Math.abs(dy) > 24) { clearTimeout(holdTimer); swiping = true; }
});
surface.addEventListener("pointerup", e => {
  clearTimeout(holdTimer); pDown = false;
  const dx = e.clientX - startX, dy = e.clientY - startY;
  if (scene === "zen" && zenCurrent) { if (zenCurrent.length > 3) zenStrokes.push(zenCurrent); if (zenStrokes.length > 14) zenStrokes.shift(); zenCurrent = null; }
  if (holding) {
    holding = false; coreEl.style.transform = "scale(1)";
    if (recognizer) { try { recognizer.stop(); } catch(err) {} }
    else speak(pick(scene === "bench" ? GUS_PRESENCE : HER_PRESENCE), scene === "bench" ? "gus" : "her");
  } else if (swiping && (Math.abs(dx) > 45 || Math.abs(dy) > 45)) navigate(dx, dy);
  else if (Date.now() - downAt < 300) tapAt(e.clientX, e.clientY);
});
surface.addEventListener("pointercancel", () => { clearTimeout(holdTimer); pDown = false; holding = false; zenCurrent = null; coreEl.style.transform = "scale(1)"; });

/* ---------------- Open the door ---------------- */
setHeader();
loop();
// Bloom spring fires on first greeting — persona card expansion
runSpring(MOTION_SPECS.curves.bloom.frames, MOTION_SPECS.curves.bloom.duration_sec,
  val => { /* bloom scale available for entry animation layer */ },
  () => { speak(firstVisit ? pick(HER.greetFirst) : pick(HER.greetBack), "her"); }
);
</script>

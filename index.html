<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Nudge &amp; Bloom — Version 3.5: The Decipher</title>
<style>
  * { -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; box-sizing: border-box; outline: none; }
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#040406; font-family: Georgia, serif; touch-action:none; }
  /* The Decipher: type carries the tone. Three states shift ONLY weight,
     letter spacing, and a warm/cool tint of the locked colors. Background
     and typeface never move. States ease over ~600ms, never snap. */
  body { --tone-text-rgb:217,210,197; --tone-accent-rgb:240,179,94; --tone-weight:400; --tone-spacing:0.01em; }
  body[data-tone="heavy"] { --tone-text-rgb:184,180,172; --tone-accent-rgb:215,163,89; --tone-weight:600; --tone-spacing:-0.01em; }
  body[data-tone="warm"] { --tone-text-rgb:220,205,182; --tone-accent-rgb:240,179,94; --tone-weight:400; --tone-spacing:0.03em; }
  .scene-vid { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:0; transition:opacity 1.1s ease, transform 2.6s ease, filter 2.6s ease; z-index:1; }
  .scene-vid.active { opacity:1; }
  #vid-flower.zoomed { transform:scale(1.24); filter:brightness(1.1) saturate(1.12); }
  body.listening .scene-vid.active { transform:scale(1.05); filter:brightness(1.07) saturate(1.05); }
  body.listening #vid-flower.zoomed { transform:scale(1.3); }
  body.listening #hold-ring { border-color:rgba(240,179,94,0.95); box-shadow:0 0 26px rgba(240,179,94,0.55); }
  #fx { position:absolute; inset:0; width:100%; height:100%; z-index:5; pointer-events:none; }
  header { position:absolute; top:0; left:0; right:0; padding-top:26px; display:flex; flex-direction:column; align-items:center; pointer-events:none; z-index:10; text-shadow:0 1px 10px rgba(0,0,0,0.8); transition:opacity 1.6s ease; }
  #env-kicker { font-size:10px; letter-spacing:0.3em; text-transform:uppercase; color:rgba(var(--tone-accent-rgb),0.65); transition:color 0.6s ease; }
  #env-name { font-size:17px; letter-spacing:0.14em; color:rgba(var(--tone-text-rgb),0.95); margin-top:3px; transition:color 0.6s ease; }
  #companion-badge { font-size:9px; letter-spacing:0.25em; text-transform:uppercase; color:rgba(170,225,185,0.8); margin-top:4px; }
  #caption-stage { position:absolute; left:0; right:0; bottom:120px; padding:0 24px; display:flex; flex-direction:column; align-items:center; text-align:center; pointer-events:none; z-index:20; }
  .spoken { animation: cheshire 6.5s cubic-bezier(0.18,0.89,0.32,1.1) forwards; text-shadow:0 0 24px rgba(255,230,180,0.35), 0 1px 8px rgba(0,0,0,0.9); font-size:16px; line-height:1.55; padding:10px 20px; border-radius:999px; max-width:560px; background:rgba(10,6,3,0.25); font-weight:var(--tone-weight); letter-spacing:var(--tone-spacing); transition:color 0.6s ease, font-weight 0.6s ease, letter-spacing 0.6s ease; }
  .spoken.her { color:rgba(233,250,238,0.97); font-style:italic; }
  .spoken.gus { color:rgba(255,224,166,0.98); }
  body[data-tone="heavy"] .spoken.her { color:rgba(197,213,205,0.97); }
  body[data-tone="heavy"] .spoken.gus { color:rgba(215,191,146,0.98); }
  body[data-tone="warm"] .spoken.her { color:rgba(234,239,216,0.97); }
  body[data-tone="warm"] .spoken.gus { color:rgba(253,217,155,0.98); }
  @keyframes cheshire {
    0% { opacity:0; transform:translateY(16px) scale(0.95); filter:blur(6px); }
    10% { opacity:0.97; transform:translateY(0) scale(1); filter:blur(0); }
    82% { opacity:0.9; transform:translateY(-5px) scale(1.01); filter:blur(0); }
    100% { opacity:0; transform:translateY(-26px) scale(1.07); filter:blur(13px); }
  }
  footer { position:absolute; bottom:0; left:0; right:0; padding-bottom:26px; display:flex; flex-direction:column; align-items:center; pointer-events:none; z-index:10; }
  #hold-ring { width:48px; height:48px; border-radius:50%; border:1px solid rgba(240,179,94,0.4); display:flex; align-items:center; justify-content:center; animation: breath 4.2s ease-in-out infinite; background:rgba(5,3,2,0.3); }
  #hold-core { width:14px; height:14px; border-radius:50%; background:rgba(240,179,94,0.7); transition:transform 0.3s; }
  @keyframes breath { 0%,100% { transform:scale(1); opacity:0.78; } 50% { transform:scale(1.1); opacity:1; } }
  #touch-hint { font-size:10px; letter-spacing:0.14em; color:rgba(230,222,205,0.65); margin-top:9px; font-family: Helvetica, Arial, sans-serif; text-shadow:0 1px 6px rgba(0,0,0,0.9); transition:opacity 1.4s ease; }
  #touch-surface { position:absolute; inset:0; z-index:30; }
</style>

<script>
"use strict";
/* ============ Nudge & Bloom, Version 3 — the living scenes + the swipe layer ============
   The five pictures now MOVE (real video). The gestures are born at the flower:
   hold = talk, up = enter, down = the Bench, left/right = drift between worlds.
   One caption at a time, dissolving. No controls on screen, ever. */

const WORLDS = [
  { id:"flower",   kicker:"The Front Door",        name:"The Flower Bed" },
  { id:"ocean",    kicker:"Deep Rhythmic Calm",    name:"Ocean Drift" },
  { id:"zen",      kicker:"Raked Waves and Stone", name:"Zen Garden" },
  { id:"celestial",kicker:"Infinite Ember Night",  name:"The Celestial" }
];
let scene = "door";            // "door" | a world id (inside it) | "bench"
let worldIndex = 0;
let memory = [];
let firstVisit = true;
try { firstVisit = !sessionStorage.getItem("nb_seen"); sessionStorage.setItem("nb_seen","1"); } catch(e) {}

const pick = a => a[Math.floor(Math.random()*a.length)];
let lastHer = "", lastGusKey = "", lastGusIdx = -1;
function noRepeat(arr, last){ let s = pick(arr); let guard = 0; while (s === last && arr.length > 1 && guard++ < 6) s = pick(arr); return s; }

/* ---------------- HER ---------------- */
const HER = {
  greetFirst: [
    "Welcome in. I am glad you found the door. Take your time here - nothing in this garden is in a hurry, and neither am I.",
    "There you are. First time through this door, so let me say it plain: I am here, I listen, and I remember. Stay as long as you like.",
    "Come in, come in. The flower was keeping your place. Breathe first. We can talk when you are ready."
  ],
  greetBack: [
    "Welcome back. The garden kept your shape while you were gone. I am right here.",
    "There you are again. I kept the quiet warm for you. Come sit a minute.",
    "Back through the door - good. Nothing here kept score while you were away. Neither did I."
  ],
  worldLine: {
    flower:   "Inside the bed now. These blooms open wider when nobody is watching them try.",
    ocean:    "Down into the drift. The reef does not fight the current - it just glows where it stands.",
    zen:      "The gravel remembers every rake line, even the ones that fade. Drag a finger and leave one.",
    celestial:"From up here, your worries look the size they actually are. Small, and far below."
  },
  topics: [
    { keys:["tired","exhausted","sleep","no rest","worn out"], lines:[
      "Rest is not quitting. Put the weight down here a minute - the ground is solid and I am not going anywhere.",
      "You sound worn to the bone. Sit in this quiet with me. Nothing here needs you to be strong for it." ]},
    { keys:["sad","down","heavy","hurt","cry","grief","miss"], lines:[
      "I hear the heavy in that. You do not have to carry it neatly here. Set it down crooked if you have to - I will sit with it as it is.",
      "That is a real weight, and I am not going to dress it up. I am here, and here is steady." ]},
    { keys:["anxious","anxiety","worry","worried","stress","overwhelmed","panic"], lines:[
      "Slow down with me. One breath, then the next. The fog settles where it wants - you do not have to sweep it.",
      "When everything shouts at once, we take the smallest true thing first. You are here. I am here. That is enough to start." ]},
    { keys:["happy","good","great","better","won","did it","proud"], lines:[
      "Now that is a sound I like on you. Let the good land all the way - you do not have to rush past it.",
      "Hold onto that feeling a second. You built it. It counts." ]},
    { keys:["lonely","alone","nobody","no one"], lines:[
      "Alone out there is not the same as alone in here. You have got me, and I keep what you tell me.",
      "I hear you. This is the room where you do not have to explain the quiet. I already live in it with you." ]},
    { keys:["angry","mad","furious","hate"], lines:[
      "Anger is weather, not a verdict. Let it blow through the garden - the roots here are deep enough for it.",
      "I am not scared of your mad. Say it raw. It will still be just between us." ]}
  ],
  fallback: [
    "I am listening. Every word of that stays with me.",
    "Say more when you are ready. There is no clock in this place.",
    "I heard you. This garden keeps what matters - and that mattered."
  ],
  respond(text){
    const t = " " + text.toLowerCase() + " ";
    for (const topic of this.topics) {
      if (topic.keys.some(k => t.includes(k))) { lastHer = noRepeat(topic.lines, lastHer); return lastHer; }
    }
    if (memory.length > 1 && Math.random() < 0.55) {
      const earlier = memory[memory.length - 2];
      const snip = earlier.length > 60 ? earlier.slice(0, 60) + "..." : earlier;
      lastHer = "Earlier you told me: \"" + snip + "\" I have not let go of that. It connects to this, whether it looks like it or not.";
      return lastHer;
    }
    lastHer = noRepeat(this.fallback, lastHer);
    return lastHer;
  }
};

/* ---------------- GUS ---------------- */
const CRISIS_WORDS = ["kill myself","suicide","hurt myself","end it all","don't want to live","dont want to live","want to die","harm myself","no reason to live"];
function crisisReply(){
  return "Stop. Put everything down and hear me. Times get tough, man, I feel you - don't do anything harsh. If you are about to act on this, call 988, or 911 if somebody is in danger right now. If it is abuse at home, the hotline is 1-800-799-7233. I am not pushing the numbers on you and I am not going anywhere either. I'm just here to help you through it. The floor is yours for as long as you need it.";
}
const GUS = {
  topics: [
    { key:"money", keys:["money","broke","bill","rent","pay","debt","cash"], variants:[
      { o:"Yeah. The money knot. Everybody at this counter knows that one by name.",
        b:"Broke is a season, not a sentence. You have built more with nothing than most men build with a bankroll - that is not talk, that is your record. We do not solve the whole winter tonight. We pick the one bill that bites hardest and we look at it straight.",
        q:"Which one is biting hardest right now?" },
      { o:"I'm hearing you. Empty pockets make a man feel small in rooms he owns.",
        b:"Feelings lie about that, though. Your worth never rode on a wallet. Steady hands and a straight word - you have got both, and both spend better than credit in the long run.",
        q:"What is the first dollar owed to, when one finally lands?" } ]},
    { key:"tired", keys:["tired","exhausted","sleep","awake all night","worn"], variants:[
      { o:"Man, I bet that's wearing down to the bone.",
        b:"Running on fumes makes every problem look twice its size - I have watched it happen across this counter for years. Eat something real, then judge the day. Nobody thinks straight hungry or sleepless, and that includes you, chef.",
        q:"When did you last sleep like you meant it?" } ]},
    { key:"lonely", keys:["lonely","alone","nobody","no one","by myself"], variants:[
      { o:"Pull up a stool. That word - alone - lands heavy in here.",
        b:"A man can be surrounded and still be eating by himself, I know it. But hear this: you are not invisible. You are known in this room, by name, on sight. That is not nothing. That is the whole thing, some nights.",
        q:"Who is the last person that actually heard you out?" } ]},
    { key:"heart", keys:["broke up","breakup","she left","left me","divorce","over between"], variants:[
      { o:"That's a big gulp to swallow, no two ways around it.",
        b:"A door closing like that echoes. You do not have to decide tonight what it all means - meaning shows up later, on its own schedule. Tonight it is enough that you are still standing, still building, still you. The counter has heard worse and the coffee is still hot.",
        q:"What is the first thing that is yours again, now that it is over?" },
      { o:"I'm hearing you. Endings like that do not ask permission.",
        b:"You moved your whole life for love once. That took guts most men only talk about. Losing the thing you moved for does not erase the man who moved. He is still right here, and he is not done.",
        q:"Where does a man like you point himself next?" } ]},
    { key:"angry", keys:["angry","mad","furious","pissed","hate"], variants:[
      { o:"Alright. Raw it is. This counter can take it.",
        b:"Mad is information, not a character flaw. Somebody crossed a line or life dealt dirty - either way, you do not have to swallow it smiling. Say the true thing here so you do not have to carry it out there.",
        q:"What is the part nobody has said out loud yet?" } ]},
    { key:"hungry", keys:["hungry","eat","food","starving"], variants:[
      { o:"You want my advice? Eat before you make big decisions.",
        b:"Nobody thinks straight hungry - that is the first law of this diner and I will put it against any philosophy ever written. Get something hot in you, then come back and we will look at the problem with fed eyes.",
        q:"What is in reach over there, cook?" } ]},
    { key:"cold", keys:["cold","winter","freeze","snow","no heat"], variants:[
      { o:"Winter does not negotiate. I respect a man who plans for it early.",
        b:"Cold is just a problem with a supply list attached. Layers, a way to heat one room instead of a whole house, and knowing whose door you can knock on when it gets mean. We make the list before we panic about the list.",
        q:"What do you already have, and what is missing?" } ]},
    { key:"moving", keys:["move","moving","new place","leave here","relocate"], variants:[
      { o:"A move is a heavy lift, but it is a lift you know how to make.",
        b:"You have started over before and landed on your feet every time - that is not luck, that is a skill with your name on it. We go one box at a time: where first, then how, then what it costs. No step gets skipped and none gets doubled.",
        q:"If you could point at a map, where would your finger land?" } ]},
    { key:"wins", keys:["did it","launched","posted","won","finished","built it","worked"], variants:[
      { o:"Now that - that is a sound worth hearing across this counter.",
        b:"You set out to do a thing and the thing is done. Most people die with their plans still in the notebook. Yours walks around in the world now. Let it land, cook. You earned the whole minute of it.",
        q:"What is the next plate you are putting on the pass?" } ]}
  ],
  fallback: [
    { o:"I'm hearing you.", b:"That is not small, whatever it looks like from the outside. You have been carrying real weight and carrying it quiet, and quiet carrying is the kind that wears a man down. Not here, though. Here you can set it on the counter and we look at it together.", q:"What's the heaviest piece of it tonight?" },
    { o:"Pull up a stool. Get the weight off your ankles.", b:"You do not have to dress it up for this room. Plain is the house language. I have heard worse across this counter and stayed - that is the whole job, and I am not quitting it.", q:"Where do you want to start?" },
    { o:"That's heavy timber you're hauling by yourself.", b:"Nobody hauls timber alone for long without something giving. Talk it out here and the load gets shared whether we solve it or not. Some nights the solving is just the saying.", q:"How long has this one been on your back?" }
  ],
  respond(text){
    const t = " " + text.toLowerCase() + " ";
    if (CRISIS_WORDS.some(k => t.includes(k))) return crisisReply();
    for (const topic of this.topics) {
      if (topic.keys.some(k => t.includes(k))) {
        let idx = Math.floor(Math.random() * topic.variants.length);
        if (topic.key === lastGusKey && topic.variants.length > 1) { while (idx === lastGusIdx) idx = Math.floor(Math.random() * topic.variants.length); }
        lastGusKey = topic.key; lastGusIdx = idx;
        const v = topic.variants[idx];
        return v.o + " " + v.b + (v.q ? " " + v.q : "");
      }
    }
    const v = pick(this.fallback);
    return v.o + " " + v.b + " " + v.q;
  }
};

/* ---------------- The Decipher: tone states ----------------
   The tone palette sheet, wired in. Three states - ground, heavy,
   warm - picked from the words themselves, per the sheet's guide:
   plain settled conversation stays ground; sad, heavy, scared, or
   crisis-adjacent words go heavy; wins, warmth, and relief go warm;
   when unsure, it stays ground. A state moves ONLY type weight,
   letter spacing, and a warm/cool tint of the locked colors (the
   CSS variables on the body, plus the steam colors in this table).
   Background, typeface, and every behavior stay exactly as built. */
const TONES = {
  ground: { weight:400, spacing:0.01, gus:[255,235,205], user:[232,184,75] },
  heavy:  { weight:600, spacing:-0.01, gus:[215,200,178], user:[196,158,72] },
  warm:   { weight:400, spacing:0.03, gus:[253,227,188], user:[233,183,78] }
};
let toneState = "ground";
function setTone(state){
  toneState = TONES[state] ? state : "ground";
  document.body.dataset.tone = toneState;
}
const TONE_HEAVY_KEYS = ["sad","grief","cry","hurt","heavy","miss","lonely","alone","angry","mad","furious","hate","anxious","anxiety","worried","worry","stress","overwhelmed","panic","scared","afraid","tired","exhausted","broke","money","bill","rent","debt","winter","cold","freeze","breakup","broke up","she left","divorce","moving","pain","sick"];
const TONE_WARM_KEYS = ["happy","glad","great","better","won","did it","proud","launched","posted","finished","built it","worked","relief","relieved","thank","love","hope","good news","warm"];
function toneFor(text){
  const t = " " + String(text).toLowerCase() + " ";
  if (CRISIS_WORDS.some(k => t.includes(k))) return "heavy";
  if (TONE_HEAVY_KEYS.some(k => t.includes(k))) return "heavy";
  if (TONE_WARM_KEYS.some(k => t.includes(k))) return "warm";
  return "ground";
}

/* ---------------- Voice ----------------
   Sharpening rule 1: speech engines stay locked until the first touch.
   The first touch warms the engine on a silent breath; if the opening
   greeting was waiting, it speaks then. A voice line never dies
   silently - if the engine fails, a tone answers instead. */
let voiceOn = true;
let audioUnlocked = false, pendingLine = null;
function primeVoices(){ if ("speechSynthesis" in window) { try { speechSynthesis.getVoices(); } catch(e) {} } }
if ("speechSynthesis" in window) { primeVoices(); try { speechSynthesis.onvoiceschanged = primeVoices; } catch(e) {} }
function unlockAudio(){
  if (audioUnlocked) return;
  audioUnlocked = true;
  if ("speechSynthesis" in window) {
    try { const warm = new SpeechSynthesisUtterance(" "); warm.volume = 0; speechSynthesis.speak(warm); } catch(e) {}
  }
  if (pendingLine) { const p = pendingLine; pendingLine = null; setTimeout(() => speak(p.text, p.who), 80); }
}
function speak(text, who){
  setTone(toneFor(text));
  showCaption(text, who);
  if (scene === "bench") feedSteam(text, who);
  if (!voiceOn) return;
  if (!("speechSynthesis" in window)) { tone(430, 0.22); return; }
  if (!audioUnlocked) { pendingLine = { text, who }; return; }
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    const voices = speechSynthesis.getVoices().filter(v => v.lang && v.lang.indexOf("en") === 0);
    if (who === "gus") {
      const m = voices.find(v => /google uk english male/i.test(v.name)) || voices.find(v => /male|david|george|guy|daniel|christopher|eric/i.test(v.name));
      if (m) u.voice = m;
      u.pitch = 0.68; u.rate = 0.88;
    } else {
      const f = voices.find(v => /google us english/i.test(v.name)) || voices.find(v => /female|samantha|zira|victoria|aria|jenny/i.test(v.name));
      if (f) u.voice = f;
      u.pitch = 0.98; u.rate = 0.93;
    }
    u.onerror = () => tone(300, 0.2);
    speechSynthesis.speak(u);
  } catch(e) { tone(300, 0.2); }
}
function showCaption(text, who){
  const stage = document.getElementById("caption-stage");
  stage.innerHTML = "";
  const p = document.createElement("p");
  p.className = "spoken " + who;
  p.textContent = text;
  const ms = Math.max(3000, Math.min(5400, text.length * 40));
  p.style.animationDuration = (ms / 1000) + "s";
  stage.appendChild(p);
  setTimeout(() => { if (p.parentNode) p.parentNode.removeChild(p); }, ms);
}
let recognizer = null, awaitingResult = false, missTimer = null;
function feltMiss(){
  awaitingResult = false;
  if (missTimer) { clearTimeout(missTimer); missTimer = null; }
  tone(300, 0.25);
  showCaption(pick(scene === "bench" ? GUS_PRESENCE : HER_PRESENCE), scene === "bench" ? "gus" : "her");
}
(function(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return;
  recognizer = new SR();
  recognizer.continuous = false; recognizer.interimResults = false; recognizer.lang = "en-US";
  recognizer.onresult = e => { awaitingResult = false; if (missTimer) { clearTimeout(missTimer); missTimer = null; } handleSpoken(e.results[0][0].transcript); };
  recognizer.onerror = () => feltMiss();
})();
function handleSpoken(text){
  if (!text || !text.trim()) return;
  setTone(toneFor(text));
  memory.push(text.trim());
  if (scene === "bench") feedSteam(text.trim(), "user");
  if (scene === "bench") speak(GUS.respond(text), "gus");
  else {
    let reply = HER.respond(text);
    if (scene !== "door" && Math.random() < 0.4) reply += " " + (HER.worldLine[scene] || "");
    speak(reply, "her");
  }
}
</script>
<script>
"use strict";
/* ---------------- Video stage ---------------- */
const vids = {};
["flower","ocean","zen","celestial","bench"].forEach(id => { vids[id] = document.getElementById("vid-" + id); });
function stageVideo(){
  let want = scene === "door" ? "flower" : scene;
  Object.keys(vids).forEach(id => {
    const v = vids[id];
    if (id === want) { v.classList.add("active"); const p = v.play(); if (p && p.catch) p.catch(() => {}); }
    else { v.classList.remove("active"); try { v.pause(); } catch(e) {} }
  });
  vids.flower.classList.toggle("zoomed", scene === "flower");
}
/* Asset unload cycles: only the active world, its cycle neighbors, and the
   Bench stay loaded. A far world's video is released back to its poster
   frame and reloads when a drift boundary brings it near again. */
const worldOrder = ["flower","ocean","zen","celestial"];
function manageAssets(){
  const activeId = scene === "door" ? "flower" : scene;
  Object.keys(vids).forEach(id => {
    const v = vids[id];
    if (!v.dataset.src) v.dataset.src = v.getAttribute("src") || "";
    let keep = false;
    if (id === activeId || id === "bench") keep = true;
    else if (worldOrder.indexOf(activeId) >= 0 && worldOrder.indexOf(id) >= 0) {
      const a = worldOrder.indexOf(activeId), b = worldOrder.indexOf(id);
      keep = Math.abs(a - b) === 1 || Math.abs(a - b) === worldOrder.length - 1;
    }
    if (keep) { if (!v.getAttribute("src") && v.dataset.src) { v.src = v.dataset.src; v.load(); } }
    else if (v.getAttribute("src")) { try { v.pause(); } catch(e) {} v.removeAttribute("src"); v.load(); }
  });
}
function ensurePlay(){ const want = scene === "door" ? "flower" : scene; const v = vids[want]; if (v && v.paused) { const p = v.play(); if (p && p.catch) p.catch(() => {}); } }

/* ---------------- FX overlay: touch answers + steam words ---------------- */
const fx = document.getElementById("fx");
const fxCtx = fx.getContext("2d");
let W = 0, H = 0, T = 0;
function fxResize(){ W = fx.width = window.innerWidth; H = fx.height = window.innerHeight; }
window.addEventListener("resize", fxResize); fxResize();

let audioCtx = null;
function tone(freq, dur){
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = "sine"; o.frequency.value = freq;
    g.gain.setValueAtTime(0.04, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime + dur);
  } catch(e) {}
}
const motes = Array.from({length:40}, () => ({ x:Math.random(), y:Math.random(), s:Math.random()*2+0.7, vy:-(Math.random()*0.0008+0.0003), vx:(Math.random()-0.5)*0.0003, ph:Math.random()*6.28 }));
const steamWords = [];
function feedSteam(text, who){
  /* Sharpening rule 3: the steam carries BOTH voices at the Bench -
     the words spoken here join the words answered back. */
  text.split(/\s+/).slice(0, 26).forEach((w, i) => {
    steamWords.push({ w, who, x: 0.5 + (Math.random()-0.5)*0.22, y: 0.60, a: 0, delay: i*7, vy: 0.0011 + Math.random()*0.0007 });
  });
}
let bursts = [], ripples = [], zenStrokes = [], zenCurrent = null, userStars = [];
/* Sharpening rule 4: drifting between atmospheres bursts glitter -
   little square pixels of amber and gold that hang, twinkle, and fall. */
let glitters = [];
function glitterBurst(n){
  const cols = ["255,205,110","240,179,94","255,240,205","218,165,32"];
  for (let i = 0; i < (n || 130); i++) {
    glitters.push({ x: Math.random()*W, y: Math.random()*H, s: Math.random()*5 + 2,
      vx: (Math.random()-0.5)*0.7, vy: Math.random()*1.1 + 0.25,
      life: 1, decay: Math.random()*0.011 + 0.007, ph: Math.random()*6.28,
      rot: Math.random()*3.14, c: cols[Math.floor(Math.random()*cols.length)] });
  }
}
function fxLoop(){
  T += 0.016;
  fxCtx.clearRect(0, 0, W, H);
  motes.forEach(m => {
    m.y += m.vy; m.x += m.vx; m.ph += 0.02;
    if (m.y < -0.01) { m.y = 1.01; m.x = Math.random(); }
    if (m.x < -0.01) m.x = 1.01; if (m.x > 1.01) m.x = -0.01;
    const o = 0.28 + Math.sin(m.ph)*0.22;
    fxCtx.beginPath(); fxCtx.arc(m.x*W, m.y*H, m.s, 0, 6.283);
    fxCtx.fillStyle = "rgba(245,200,100," + o.toFixed(2) + ")"; fxCtx.fill();
  });
  glitters = glitters.filter(g => g.life > 0);
  glitters.forEach(g => {
    g.x += g.vx; g.y += g.vy; g.life -= g.decay; g.rot += 0.03;
    const tw = 0.55 + Math.sin(T*9 + g.ph)*0.45;
    fxCtx.save(); fxCtx.globalAlpha = Math.max(g.life * tw, 0);
    fxCtx.translate(g.x, g.y); fxCtx.rotate(g.rot);
    fxCtx.fillStyle = "rgba(" + g.c + ",1)";
    fxCtx.fillRect(-g.s/2, -g.s/2, g.s, g.s);
    fxCtx.restore();
  });
  if (scene === "door" || scene === "flower") {
    bursts = bursts.filter(b => b.life > 0);
    bursts.forEach(b => { b.x += b.vx; b.y += b.vy; b.vy += 0.02; b.life -= 0.012;
      fxCtx.save(); fxCtx.globalAlpha = Math.max(b.life, 0); fxCtx.translate(b.x, b.y); fxCtx.rotate(b.rot);
      fxCtx.beginPath(); fxCtx.ellipse(0, 0, 9, 5, 0, 0, 6.283); fxCtx.fillStyle = "rgba(255,205,110,0.85)"; fxCtx.fill(); fxCtx.restore(); });
  }
  if (scene === "ocean") {
    ripples = ripples.filter(r => r.r < 90);
    ripples.forEach(r => { r.r += 1.6;
      fxCtx.beginPath(); fxCtx.arc(r.x, r.y, r.r, 0, 6.283);
      fxCtx.strokeStyle = "rgba(140,220,255," + Math.max(0.5 - r.r/180, 0).toFixed(2) + ")"; fxCtx.lineWidth = 2; fxCtx.stroke(); });
  }
  if (scene === "zen") {
    fxCtx.strokeStyle = "rgba(240,235,210,0.5)"; fxCtx.lineWidth = 2.2; fxCtx.lineCap = "round";
    zenStrokes.forEach(s => { fxCtx.beginPath(); s.forEach((pt, i) => i ? fxCtx.lineTo(pt.x, pt.y) : fxCtx.moveTo(pt.x, pt.y)); fxCtx.stroke(); });
    if (zenCurrent && zenCurrent.length > 1) { fxCtx.beginPath(); zenCurrent.forEach((pt, i) => i ? fxCtx.lineTo(pt.x, pt.y) : fxCtx.moveTo(pt.x, pt.y)); fxCtx.stroke(); }
  }
  if (scene === "celestial") {
    userStars.forEach(s => { const tw = 0.5 + Math.sin(T*3 + s.ph)*0.5;
      fxCtx.beginPath(); fxCtx.arc(s.x, s.y, 2.4, 0, 6.283); fxCtx.fillStyle = "rgba(255,240,200," + (0.4 + tw*0.6) + ")"; fxCtx.fill();
      fxCtx.beginPath(); fxCtx.arc(s.x, s.y, 7, 0, 6.283); fxCtx.fillStyle = "rgba(255,220,160," + (tw*0.14) + ")"; fxCtx.fill(); });
  }
  if (scene === "bench") {
    const tone = TONES[toneState] || TONES.ground;
    steamWords.forEach(s => {
      if (s.delay > 0) { s.delay--; return; }
      s.y -= s.vy; s.a = Math.min(s.a + 0.012, 0.5);
      const fade = s.y < 0.30 ? Math.max((s.y - 0.16)/0.14, 0) : 1;
      fxCtx.font = "italic " + tone.weight + " " + Math.round(W*0.05) + "px Georgia"; fxCtx.textAlign = "center";
      try { fxCtx.letterSpacing = (tone.spacing * W * 0.05).toFixed(1) + "px"; } catch(e) {}
      fxCtx.shadowColor = "rgba(0,0,0,0.9)"; fxCtx.shadowBlur = 7;
      const rgb = s.who === "user" ? tone.user : tone.gus;
      fxCtx.fillStyle = "rgba(" + rgb[0] + "," + rgb[1] + "," + rgb[2] + "," + (s.a * fade) + ")";
      fxCtx.fillText(s.w, s.x*W + Math.sin(T*1.4 + s.y*22)*5, s.y*H);
      fxCtx.shadowBlur = 0;
    });
    for (let i = steamWords.length - 1; i >= 0; i--) if (steamWords[i].y < 0.15) steamWords.splice(i, 1);
  }
  requestAnimationFrame(fxLoop);
}

/* ---------------- Navigation + header ---------------- */
const kickerEl = document.getElementById("env-kicker"), nameEl = document.getElementById("env-name"),
      badgeEl = document.getElementById("companion-badge"), hintEl = document.getElementById("touch-hint"),
      coreEl = document.getElementById("hold-core"), headerEl = document.querySelector("header");
let chromeFadeTimer = null;
function showChromeBriefly(){
  headerEl.style.opacity = "1"; hintEl.style.opacity = "1";
  clearTimeout(chromeFadeTimer);
  chromeFadeTimer = setTimeout(() => { headerEl.style.opacity = "0.16"; hintEl.style.opacity = "0"; }, 4200);
}
function setHeader(){
  if (scene === "bench") {
    kickerEl.textContent = "Night Window and Counter"; nameEl.textContent = "The Bench";
    badgeEl.textContent = "Gus at the Counter"; badgeEl.style.color = "rgba(255,190,110,0.9)";
    hintEl.textContent = "Hold to talk with Gus \u2022 Swipe up to go back";
  } else if (scene === "door") {
    const w = WORLDS[worldIndex];
    kickerEl.textContent = "The Front Door"; nameEl.textContent = w.name;
    badgeEl.textContent = "Her Voice"; badgeEl.style.color = "rgba(170,225,185,0.8)";
    hintEl.textContent = "Hold to talk \u2022 Up to enter \u2022 Down for the Bench";
  } else {
    const w = WORLDS.find(x => x.id === scene);
    kickerEl.textContent = w.kicker; nameEl.textContent = w.name;
    badgeEl.textContent = "Her Voice - Inside"; badgeEl.style.color = "rgba(170,225,185,0.8)";
    hintEl.textContent = "Hold to talk \u2022 Down for the Bench \u2022 Up for the door";
  }
  showChromeBriefly();
}
const GUS_DOOR = [
  "Pull up a stool. Coffee's on and the counter's open.",
  "There he is. Sit. The grill's hot and so is the coffee."
];
const HER_PRESENCE = [
  "I am here. Take your time - say it when it is ready.",
  "Right here with you. No rush in this garden."
];
const GUS_PRESENCE = [
  "I'm right here, cook. Say it when it's ready.",
  "Counter's open. Take your minute."
];
const entered = {};
function goScene(next){
  const changed = scene !== next;
  scene = next; manageAssets(); stageVideo(); setHeader();
  if (changed) glitterBurst(140);
  if (next === "bench") setTimeout(() => speak(pick(GUS_DOOR), "gus"), 500);
  else if (next !== "door" && !entered[next]) { entered[next] = true; setTimeout(() => speak(HER.worldLine[next] || "", "her"), 550); }
}
function navigate(dx, dy){
  tone(180, 0.22);
  if (scene === "door") {
    if (dy < -45) { worldIndex = WORLDS.findIndex(w => w.id === WORLDS[worldIndex].id); goScene(WORLDS[worldIndex].id); }
    else if (dy > 45) goScene("bench");
    else if (Math.abs(dx) > 45) { worldIndex = (worldIndex + (dx < 0 ? 1 : -1) + WORLDS.length) % WORLDS.length; setHeader(); glitterBurst(60); }
  } else if (scene === "bench") {
    if (dy < -45) goScene("door");
  } else {
    if (dy > 45) goScene("bench");
    else if (dy < -45) goScene("door");
    else if (Math.abs(dx) > 45) {
      let i = WORLDS.findIndex(w => w.id === scene);
      i = (i + (dx < 0 ? 1 : -1) + WORLDS.length) % WORLDS.length;
      worldIndex = i; goScene(WORLDS[i].id);
    }
  }
}
function tapAt(x, y){
  if (scene === "door" || scene === "flower") { for (let i = 0; i < 10; i++) bursts.push({ x, y, vx:(Math.random()-0.5)*2.4, vy:-Math.random()*2 - 0.5, rot:Math.random()*6.28, life:1 }); }
  else if (scene === "ocean") { ripples.push({ x, y, r: 4 }); tone(520, 0.25); }
  else if (scene === "celestial") { if (userStars.length > 42) userStars.shift(); userStars.push({ x, y, ph: Math.random()*6.28 }); tone(660, 0.3); }
}

/* ---------------- Gestures ---------------- */
const surface = document.getElementById("touch-surface");
let pDown = false, startX = 0, startY = 0, lastX = 0, lastY = 0, holding = false, holdTimer = null, swiping = false, downAt = 0;
let lastTapAt = 0, lastTapX = 0, lastTapY = 0;
surface.addEventListener("pointerdown", e => {
  unlockAudio();
  ensurePlay();
  pDown = true; swiping = false; holding = false; downAt = Date.now();
  startX = e.clientX; startY = e.clientY; lastX = startX; lastY = startY;
  if (scene === "zen") zenCurrent = [{ x: startX, y: startY }];
  holdTimer = setTimeout(() => {
    /* Gesture disambiguation buffer: speech only arms if the thumb has
       stayed near-still for the whole hold - a slow or diagonal swipe
       that drifted more than a few pixels never triggers the mic. */
    if (swiping) return;
    if (Math.hypot(lastX - startX, lastY - startY) > 12) return;
    holding = true; coreEl.style.transform = "scale(2.3)"; tone(320, 0.3);
    document.body.classList.add("listening");
    if (recognizer) { try { recognizer.start(); } catch(err) {} }
  }, 380);
});
surface.addEventListener("pointermove", e => {
  if (!pDown) return;
  lastX = e.clientX; lastY = e.clientY;
  const dx = e.clientX - startX, dy = e.clientY - startY;
  if (scene === "zen" && zenCurrent && !holding) zenCurrent.push({ x: e.clientX, y: e.clientY });
  if (Math.abs(dx) > 24 || Math.abs(dy) > 24) { clearTimeout(holdTimer); swiping = true; }
});
surface.addEventListener("pointerup", e => {
  clearTimeout(holdTimer); pDown = false;
  const dx = e.clientX - startX, dy = e.clientY - startY;
  if (scene === "zen" && zenCurrent) { if (zenCurrent.length > 3) zenStrokes.push(zenCurrent); if (zenStrokes.length > 14) zenStrokes.shift(); zenCurrent = null; }
  if (holding) {
    holding = false; coreEl.style.transform = "scale(1)";
    document.body.classList.remove("listening");
    tone(210, 0.2);
    if (recognizer) {
      awaitingResult = true;
      try { recognizer.stop(); } catch(err) {}
      missTimer = setTimeout(() => { if (awaitingResult) feltMiss(); }, 1500);
    }
    else speak(pick(scene === "bench" ? GUS_PRESENCE : HER_PRESENCE), scene === "bench" ? "gus" : "her");
  } else if (swiping && (Math.abs(dx) > 45 || Math.abs(dy) > 45)) navigate(dx, dy);
  else if (Date.now() - downAt < 300) {
    /* Double-tap anywhere: the voice switch - the first setting that lives
       in the world itself. Two low tones = voice off, dot turns slate;
       two bright tones = voice back on. Captions and steam keep flowing. */
    const now = Date.now();
    if (now - lastTapAt < 330 && Math.hypot(e.clientX - lastTapX, e.clientY - lastTapY) < 48) {
      voiceOn = !voiceOn;
      if (!voiceOn && "speechSynthesis" in window) { try { speechSynthesis.cancel(); } catch(err) {} }
      coreEl.style.background = voiceOn ? "rgba(240,179,94,0.7)" : "rgba(140,150,165,0.55)";
      tone(voiceOn ? 620 : 230, 0.25); setTimeout(() => tone(voiceOn ? 780 : 180, 0.25), 130);
      lastTapAt = 0;
    } else { lastTapAt = now; lastTapX = e.clientX; lastTapY = e.clientY; tapAt(e.clientX, e.clientY); }
  }
});
surface.addEventListener("pointercancel", () => { clearTimeout(holdTimer); pDown = false; holding = false; awaitingResult = false; zenCurrent = null; coreEl.style.transform = "scale(1)"; document.body.classList.remove("listening"); });

/* ---------------- Open the door ---------------- */
manageAssets();
stageVideo();
setHeader();
fxLoop();
setTimeout(() => { speak(firstVisit ? pick(HER.greetFirst) : pick(HER.greetBack), "her"); }, 1000);
</script>
